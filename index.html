<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>عالم إيمان</title>
<style>
:root{--bg:#fff3cf;--tx:#3a2a14;--cap:#7a6644;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--tx:#f4ead2;--cap:#cbb98f}}
:root[data-theme="dark"]{--bg:#1d1a14;--tx:#f4ead2;--cap:#cbb98f}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:32px}
.wrap{display:grid;grid-template-columns:auto minmax(0,540px) auto;gap:clamp(8px,2vw,22px);align-items:center;padding:12px;width:100%;max-width:760px}
.col{display:flex;flex-direction:column;gap:18px;align-items:center}
.b{width:clamp(50px,11vw,68px);aspect-ratio:1;border-radius:50%;border:0;cursor:pointer;padding:0;display:grid;place-items:center;box-shadow:0 4px 0 rgba(0,0,0,.25);transition:transform .15s,box-shadow .15s}
.b:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.b.on{outline:4px solid var(--tx);outline-offset:3px}
.b svg{width:62%;height:62%}
.cap{font-size:11px;color:var(--cap);text-align:center;margin-top:6px}
.box{aspect-ratio:1;border-radius:clamp(18px,4vw,32px);overflow:hidden;position:relative;box-shadow:0 8px 0 rgba(0,0,0,.2);background:#ffd75e}
.box>svg{width:100%;height:100%;display:block}
.bub{position:absolute;inset:4% 4% auto 4%;background:#fff;color:#2b2b2b;border-radius:16px;padding:10px 14px;font-size:clamp(11px,2.3vw,15px);line-height:1.7;box-shadow:0 3px 0 rgba(0,0,0,.15);opacity:0;transform:translateY(-10px);pointer-events:none;transition:.45s}
.bub.on{opacity:1;transform:none}.bub b{color:#0a7d5a}
.sc{opacity:0;transform:translateY(24px);transition:opacity .5s,transform .5s}
.sc.on{opacity:1;transform:none}
#im{transition:transform .7s cubic-bezier(.5,0,.2,1)}
.bob{animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(4px)}}
.pop,.hh{transform-box:fill-box;transform-origin:center}
.pop{animation:pop .4s ease-out}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.hh{animation:hh 1s ease-in-out infinite alternate}
@keyframes hh{to{transform:translateY(-6px) rotate(-3deg)}}
.hint{margin-top:18px;padding:12px 22px;border-radius:16px;background:rgba(128,128,128,.14);font-size:16px;font-weight:700;text-align:center;max-width:calc(100% - 24px);box-sizing:border-box}.b.nx{animation:nx 1.2s ease-in-out infinite}@keyframes nx{50%{transform:scale(1.12);box-shadow:0 0 0 8px rgba(255,255,255,.6)}}
</style></head><body>
<div class="wrap">
<div class="col">
<div><button class="b" id="b1" style="background:#8b5a2b" aria-label="مشروب"></button><div class="cap">مشروب</div></div>
<div><button class="b" id="b2" style="background:#e5383b" aria-label="مرض"></button><div class="cap">مرض</div></div>
<div><button class="b" id="b3" style="background:#2fa84f" aria-label="استشارة"></button><div class="cap">استشارة</div></div>
</div>
<div class="box"><div id="svgw"></div>
<div class="bub" id="bub"><b>د. خولة:</b> يا إيمان، اللي صار اسمه <b>إشراط كلاسيكي</b>: لما يتكرر اقتران محفّز محايد (طعم المشروب) مع محفّز يسبب ردّ فعل تلقائي (المرض)، يصير المشروب لحاله يثير نفس الغثيان. الحل: <b>التعرّض التدريجي</b> — شمّي المشروب، ثم رشفة صغيرة، ثم كمية أكبر، شوي شوي وبدون استعجال.</div></div>
<div class="col">
<div><button class="b" id="b4" style="background:#8e44ad" aria-label="صديقة"></button><div class="cap">صديقة</div></div>
<div><button class="b" id="b5" style="background:#ff7eb6" aria-label="صديقات"></button><div class="cap">صديقات</div></div>
</div>
</div>
<script>
const C={skin:'#f3c9a5',hair:'#6b3f23',eye:'#3b2314'};
const $=id=>document.getElementById(id);
function face(m){
 const st=`fill="none" stroke="${C.eye}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"`;
 const hap=`<path d="M-19.5 4Q-14 -5 -8.5 4" ${st}/><path d="M8.5 4Q14 -5 19.5 4" ${st}/>`;
 const dots=`<circle cx="-14" cy="2" r="4.2" fill="${C.eye}"/><circle cx="14" cy="2" r="4.2" fill="${C.eye}"/>`;
 const ch=(c,o=.55)=>`<circle cx="-25" cy="14" r="6.5" fill="${c}" opacity="${o}"/><circle cx="25" cy="14" r="6.5" fill="${c}" opacity="${o}"/>`;
 const sq=`<path d="M-19 -2L-10 3L-19 8M19 -2L10 3L19 8" ${st}/>`;
 const wav=`<path d="M-9 23Q-4.5 18 0 23Q4.5 28 9 23" ${st}/>`;
 switch(m){
 case 'closed':return hap+ch('#ff8fa3')+`<path d="M-12 16Q0 31 12 16" ${st}/>`;
 case 'tongue':return hap+ch('#ff8fa3')+`<ellipse cx="2" cy="25" rx="6" ry="8" fill="#ff7b8f"/><path d="M-13 14Q0 24 13 14Q0 17 -13 14Z" fill="#8a2c2c" stroke="${C.eye}" stroke-width="2.4" stroke-linejoin="round"/>`;
 case 'sick':return `<path d="M-19 1H-9M9 1H19" ${st}/><path d="M-18 1Q-14 8 -10 1ZM10 1Q14 8 18 1Z" fill="${C.eye}"/><ellipse cx="-14" cy="10" rx="9" ry="3.5" fill="#9b1c1f" opacity=".65"/><ellipse cx="14" cy="10" rx="9" ry="3.5" fill="#9b1c1f" opacity=".65"/>`+ch('#e5383b',.65)+`<path d="M-8 23Q-4 19 0 23Q4 27 8 23" ${st}/>`;
 case 'nausea':return sq+ch('#a7d676',.85)+`<ellipse cx="0" cy="23" rx="15" ry="10" fill="#eab68c" stroke="#c98f64" stroke-width="2"/><path d="M-7 18v6M0 17v7M7 18v6" stroke="#c98f64" stroke-width="1.6"/>`;
 case 'annoy':return sq+ch('#ff8fa3',.35)+wav+`<path d="M34 -12q-6 9 0 12q6 -3 0 -12Z" fill="#7cc7ff"/>`;
 case 'attent':return `<circle cx="-14" cy="2" r="7" fill="#fff" stroke="${C.eye}" stroke-width="1.8"/><circle cx="14" cy="2" r="7" fill="#fff" stroke="${C.eye}" stroke-width="1.8"/><circle cx="-14" cy="3" r="3.5" fill="${C.eye}"/><circle cx="14" cy="3" r="3.5" fill="${C.eye}"/><path d="M-21 -11Q-14 -16 -7 -11M7 -11Q14 -16 21 -11" ${st}/><ellipse cx="0" cy="22" rx="4" ry="5" fill="#8a2c2c"/>`+ch('#ff8fa3',.35);
 case 'laugh':return hap+ch('#ff8fa3')+`<path d="M-14 13Q0 40 14 13Z" fill="#8a2c2c"/><path d="M-7 25Q0 20 7 25Q0 31 -7 25Z" fill="#ff7b8f"/>`;
 case 'calm':return `<path d="M-19 2Q-14 7 -9 2M9 2Q14 7 19 2" ${st}/>`+ch('#ff8fa3',.4)+`<path d="M-8 19Q0 25 8 19" ${st}/>`;
 default:return dots+ch('#ff8fa3',.4)+`<path d="M-9 18Q0 26 9 18" ${st}/>`;}
}
const cup=s=>`<path d="M-16 -50L-12 0H12L16 -50Z" fill="#dfeaf0"/>`+(s==='full'?`<path d="M-14.6 -36L-11.6 -2H11.6L14.6 -36Z" fill="#3b2314"/><rect x="-8" y="-32" width="9" height="9" rx="2" fill="#fff" opacity=".35"/><rect x="2" y="-20" width="9" height="9" rx="2" fill="#fff" opacity=".35"/>`:`<path d="M-11.8 -6L-11.6 -2H11.6L11.8 -6Z" fill="#3b2314"/><rect x="-7" y="-14" width="9" height="9" rx="2" fill="#fff" opacity=".7"/>`)+`<rect x="-18" y="-55" width="36" height="6" rx="3" fill="#fff" stroke="#c9d6dd"/><path d="M4 -55L12 -84" stroke="#e5383b" stroke-width="4" stroke-linecap="round"/>`;
const hand=(x)=>`<circle cx="${x}" cy="138" r="9" fill="${C.skin}"/>`;
const girl=p=>{const pn=p.pin||'#1e1e1e',sh=p.shirt||'#fff',hr=p.hair||C.hair;
return `<path d="M-44 -4Q-46 -48 0 -48Q46 -48 44 -4Q50 40 38 58H-38Q-50 40 -44 -4Z" fill="${hr}"/>
${p.bag?`<rect x="-76" y="74" width="34" height="46" rx="9" fill="#9b6a3c"/>`:''}
<rect x="-68" y="58" width="22" height="78" rx="11" fill="${sh}"/><rect x="46" y="58" width="22" height="78" rx="11" fill="${sh}"/>
<path d="M-52 200L-46 40Q0 26 46 40L52 200Z" fill="${sh}" stroke="#e6e0d0" stroke-width="1.5"/>
<path d="M-38 200L-31 54Q0 64 31 54L38 200Z" fill="${pn}"/>
<rect x="-33" y="38" width="11" height="24" fill="${pn}"/><rect x="22" y="38" width="11" height="24" fill="${pn}"/>
<rect x="-8" y="26" width="16" height="22" fill="${C.skin}"/>
${p.bag?`<path d="M-28 40L32 124" stroke="#9b6a3c" stroke-width="7"/>`:''}
${hand(-57)}${hand(57)}<g ${p.id?'id="hold"':''}>${p.hold||''}</g>
<ellipse rx="36" ry="39" fill="${C.skin}"/>
<path d="M-38 -4Q-32 -42 0 -42Q32 -42 38 -4Q22 -26 -2 -22Q-24 -20 -38 -4Z" fill="${hr}"/>
<g ${p.id?'id="face"':''}>${p.f||''}</g>${p.id?'<g id="mk"></g>':''}`};
const held=(s)=>`<g transform="translate(57,138)">${cup(s)}</g>${hand(57)}`;
const doc=`<path d="M-50 -10Q-54 60 -42 84H42Q54 60 50 -10Q50 -52 0 -52Q-50 -52 -50 -10Z" fill="#2e8b8b"/><path d="M-56 200L-50 60L-10 48L0 110L10 48L50 60L56 200Z" fill="#fff" stroke="#e1e1e1" stroke-width="1.5"/><path d="M-22 56Q-26 112 0 114Q26 112 22 56" fill="none" stroke="#555" stroke-width="3"/><circle cy="118" r="6" fill="#888"/><ellipse rx="31" ry="35" cy="2" fill="${C.skin}"/><g transform="translate(0,3) scale(.85)">${face('smile')}</g><path d="M-34 -6Q-30 -40 0 -40Q30 -40 34 -6Q18 -24 0 -22Q-18 -24 -34 -6Z" fill="#2e8b8b"/>`;
const gf=[[55,'#2b2b2b','#ffd6e0'],[145,'#8a5a2b','#cfe8ff'],[355,'#caa86a','#e1d4ff'],[445,'#3a2a2a','#d4f5d0']].map(([x,h,s],i)=>`<g class="hh" style="animation-delay:${i*.2}s"><g transform="translate(${x},385) scale(.62)">${girl({hair:h,shirt:s,pin:'#5a6f8f',f:face('laugh')})}</g></g>`).join('');
const tx=(x,y,t,d)=>`<g class="hh" style="animation-delay:${d}s"><text x="${x}" y="${y}" font-size="26" font-weight="800" fill="#d9480f" font-family="sans-serif">${t}</text></g>`;
$('svgw').innerHTML=`<svg viewBox="0 0 500 500" style="width:100%;display:block">
<rect width="500" height="500" fill="#ffd75e"/>
<defs><pattern id="lat" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#cfc7b6"/><path d="M4 0L8 4L4 8L0 4Z" fill="#f6f1e7"/></pattern></defs><rect x="198" y="60" width="104" height="12" rx="3" fill="#e4dccb"/><rect x="204" y="72" width="92" height="98" fill="#f6f1e7" stroke="#d8d0c0" stroke-width="2"/><path d="M222 170L226 430H274L278 170Z" fill="#f6f1e7" stroke="#d8d0c0" stroke-width="2"/><rect x="231" y="180" width="15" height="240" fill="url(#lat)"/><rect x="254" y="180" width="15" height="240" fill="url(#lat)"/><rect x="208" y="424" width="84" height="16" fill="#e4dccb"/><g stroke="#2b2b2b" stroke-width="3" stroke-linecap="round"><circle cx="227" cy="121" r="19" fill="#fff" stroke-width="2"/><circle cx="273" cy="121" r="19" fill="#fff" stroke-width="2"/><path d="M227 121V107M227 121L236 126M273 121V107M273 121L281 115"/></g>


<rect y="430" width="500" height="70" fill="#f5bf3a"/>
<g class="sc" id="dr"><g transform="translate(130,330) scale(.95)">${doc}</g></g>
<g class="sc" id="fr"><g transform="translate(390,336) scale(.9)">${girl({hair:'#2b2b2b',shirt:'#ffd6e0',pin:'#4a6fa5',f:face('smile'),hold:held('full')})}</g></g>
<g class="sc" id="gr">${gf}${tx(70,290,'haha',0)}${tx(380,280,'lol',.3)}${tx(215,255,'hahaha',.6)}</g>
<g id="im" style="transform:translate(250px,330px)"><g class="bob">${girl({id:1,bag:1})}</g></g></svg>`;
const ic=[`<svg viewBox="-22 -88 44 92">${cup('full')}</svg>`,
`<svg viewBox="-20 -20 40 40" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle r="8" fill="#fff"/>${[0,45,90,135,180,225,270,315].map(a=>`<g transform="rotate(${a})"><path d="M0 -9V-15"/><circle cy="-17" r="2.4" fill="#fff"/></g>`).join('')}</svg>`,
`<svg viewBox="-20 -20 40 40"><text y="13" text-anchor="middle" font-size="40" font-weight="800" fill="#fff" font-family="sans-serif">?</text></svg>`,
`<svg viewBox="-22 -16 44 34" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round"><circle cx="-9" cy="-6" r="6"/><circle cx="9" cy="-6" r="6"/><path d="M-18 14Q-9 2 0 14M0 14Q9 2 18 14"/></svg>`,
`<svg viewBox="-26 -14 52 32" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round">${[-18,-6,6,18].map(x=>`<circle cx="${x}" cy="-4" r="4.5"/><path d="M${x-5} 12Q${x} 3 ${x+5} 12"/>`).join('')}</svg>`];
ic.forEach((s,i)=>$('b'+(i+1)).innerHTML=s);
let sc=null,cond=0,rec=0,over=null,cupS=null,mk='',T=[];
const X={dr:340,fr:200,gr:250};
const bang=`<g class="pop"><text x="84" y="100" font-size="50" font-weight="900" fill="#e5383b" font-family="sans-serif">!</text><text x="104" y="80" font-size="34" font-weight="900" fill="#e5383b" font-family="sans-serif">!</text></g>`;
const later=(f,ms)=>T.push(setTimeout(f,ms));
const reset=()=>{over=null;cupS=null;mk='';render()};
function cancel(){T.forEach(clearTimeout);T=[];over=null;cupS=null;mk=''}
function render(){
 $('face').innerHTML=face(over||(sc==='dr'?'attent':sc==='gr'?'laugh':'smile'));
 const c=cupS||(sc==='gr'?'full':null);
 $('hold').innerHTML=c?held(c):sc==='fr'?`<g transform="translate(57,138)"><circle cy="-8" r="14" fill="#d9a35b"/><circle cx="-5" cy="-12" r="2.2" fill="#5a3418"/><circle cx="5" cy="-5" r="2.2" fill="#5a3418"/><circle cx="-2" cy="-2" r="2" fill="#5a3418"/></g>${hand(57)}<g transform="translate(-57,138) rotate(-18)"><rect x="-2.5" y="-48" width="5" height="52" rx="2" fill="#e5383b"/></g>${hand(-57)}`:'';
 $('mk').innerHTML=mk;
 ['dr','fr','gr'].forEach(k=>$(k).classList.toggle('on',sc===k));
 $('bub').classList.toggle('on',sc==='dr');
 $('im').style.transform=`translate(${X[sc]||250}px,330px)`;
 [['b3','dr'],['b4','fr'],['b5','gr']].forEach(([b,k])=>$(b).classList.toggle('on',sc===k));
}
function pick(k){sc=sc===k?null:k;if(sc==='gr'&&cond)rec=1;render()}
$('b3').onclick=()=>pick('dr');$('b4').onclick=()=>pick('fr');$('b5').onclick=()=>pick('gr');
$('b2').onclick=()=>{cancel();cond=1;rec=0;over='sick';render();later(reset,4500)};
$('b1').onclick=()=>{
 cancel();
 if(rec){over='calm';cupS='full';render();later(()=>{cupS='empty';over='smile';render()},3500);later(reset,6000)}
 else if(cond&&sc==='fr'){over='annoy';mk=`<g class="pop"><text x="42" y="-30" font-size="28">💢</text></g>`;render();later(reset,5000)}
 else if(cond){over='nausea';mk=`<g class="pop"><text x="52" y="-20" font-size="30">‼️</text><text x="-84" y="0" font-size="30">‼️</text></g>`;render();later(reset,5000)}
 else{over='closed';cupS='full';render();later(()=>{cupS='empty';over='tongue';mk=bang;render()},5000);later(reset,8500)}
};
render();
const ST=[['b1','اضغطي زر المشروب 🧋'],['b2','اضغطي زر المرض 🦠'],['b1','اضغطي زر المشروب مرة ثانية 🧋'],['b3','اضغطي زر الاستشارة ❓'],['b4','اضغطي زر الصديقة 👭'],['b1','اضغطي زر المشروب 🧋'],['b5','اضغطي زر الصديقات 👯'],['b1','اضغطي زر المشروب للمرة الأخيرة 🧋']];
let step=0;
function hint(){
 const d=step>=ST.length;
 $('hint').textContent=d?'انتهى التسلسل 🎉 اضغطي «المرض» لتبدأي الاقتران من جديد':'الخطوة '+(step+1)+' من '+ST.length+': '+ST[step][1];
 ['b1','b2','b3','b4','b5'].forEach(i=>$(i).classList.toggle('nx',i===(d?'b2':ST[step][0])));
}
['b1','b2','b3','b4','b5'].forEach(id=>{const o=$(id).onclick;$(id).onclick=()=>{o();
 if(step>=ST.length){if(id==='b2')step=2}
 else if(ST[step][0]===id&&(id<'b3'||sc))step++;
 hint()}});
hint();
</script>
<div class="hint" id="hint"></div>
</body></html>
